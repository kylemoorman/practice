<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Harmonic Series Keyboard</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1e2129;
    --text: #e8e6df;
    --dim: #8b8fa0;
    --accent: #e8a33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 10px 12px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    flex: 1 1 auto;
    white-space: nowrap;
  }
  header h1 small { color: var(--dim); font-weight: 400; }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, .seg {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #333845;
    border-radius: 8px;
    font-size: 14px;
    height: 36px;
  }
  select { padding: 0 8px; }
  .seg { display: flex; overflow: hidden; }
  .seg button {
    background: transparent;
    color: var(--dim);
    border: none;
    font-size: 13px;
    padding: 0 12px;
    height: 100%;
  }
  .seg button.on {
    background: var(--accent);
    color: #14161c;
    font-weight: 600;
  }
  #hint {
    padding: 0 12px 6px;
    font-size: 12px;
    color: var(--dim);
  }
  #scope {
    flex: 1;
    min-height: 0;
    margin: 2px 8px;
    position: relative;
  }
  #scope canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 12px;
  }
  #keys {
    flex: 0 0 auto;
    height: 15vh;
    height: 15dvh;
    display: flex;
    flex-wrap: wrap;
    align-content: stretch;
    gap: 4px;
    padding: 4px 8px calc(8px + env(safe-area-inset-bottom));
    min-height: 0;
  }
  .key {
    flex: 1 1 0;
    min-width: 34px;
    border-radius: 10px;
    background: linear-gradient(180deg, #262a34, #1c1f27);
    border: 1px solid #343947;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 10px;
    gap: 2px;
    position: relative;
    overflow: hidden;
  }
  .key .h {
    position: absolute;
    top: 8px;
    font-size: 11px;
    color: var(--dim);
  }
  .key .kbd {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 9px;
    color: #565b6b;
    text-transform: uppercase;
    display: none;
  }
  /* show typing hints once a physical keyboard is used */
  body.kbd-on .key .kbd { display: block; }
  .key.active .kbd { color: #14161c; }
  .key .note { font-size: 16px; font-weight: 700; }
  .key .cents { font-size: 10px; color: var(--dim); }
  .key .hz { font-size: 9px; color: #565b6b; }
  .key.offish .note { color: var(--accent); }
  .key.active {
    background: linear-gradient(180deg, #e8a33d, #c9882a);
    border-color: #f0c070;
  }
  .key.active .note, .key.active .h, .key.active .cents, .key.active .hz {
    color: #14161c;
  }
  /* split 16–32 mode into two rows */
  #keys.dense {
    height: 24vh;
    height: 24dvh;
  }
  #keys.dense .key { flex-basis: calc(100% / 9 - 4px); }
  /* full mode: three QWERTY rows, harmonics 1-33 */
  #keys.matrix {
    height: 32vh;
    height: 32dvh;
    flex-direction: column;
    flex-wrap: nowrap;
  }
  #keys.matrix .krow {
    flex: 1;
    display: flex;
    gap: 4px;
    min-height: 0;
  }
  #keys.matrix .key { min-width: 0; padding-bottom: 4px; }
  #keys.matrix .key .h { top: 4px; left: 4px; font-size: 9px; }
  #keys.matrix .key .kbd { top: 4px; display: block; }
  #keys.matrix .key .note { font-size: 12px; }
  #keys.matrix .key .cents { font-size: 8px; }
  #keys.matrix .key .hz { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Harmonic keyboard <small>— natural trumpet scale</small></h1>
    <div class="controls">
      <select id="fund" title="Fundamental">
        <option value="49.00">G1 · 49 Hz</option>
        <option value="55.00">A1 · 55 Hz</option>
        <option value="65.41" selected>C2 · 65.4 Hz</option>
        <option value="73.42">D2 · 73.4 Hz</option>
        <option value="87.31">F2 · 87.3 Hz</option>
        <option value="98.00">G2 · 98 Hz</option>
      </select>
      <div class="seg" id="range">
        <button data-mode="8" class="on">8–16</button>
        <button data-mode="16">16–32</button>
        <button data-mode="full">Full</button>
      </div>
      <div class="seg" id="tone">
        <button data-tone="horn" class="on">Horn</button>
        <button data-tone="sine">Sine</button>
      </div>
    </div>
  </header>
  <div id="hint">True just-intonation pitches (n × f₀). Amber notes stray from 12-TET — drag across keys to sweep.</div>
  <noscript><div id="hint" style="color:#e8a33d">JavaScript is disabled in this viewer, so the keys won't make sound. Open this file in Safari or Chrome instead.</div></noscript>
  <div id="scope"><canvas></canvas></div>
  <div id="keys">
    <div class="key" data-freq="523.28"><span class="h">8</span><span class="kbd">a</span><span class="note">C<sub>5</sub></span><span class="cents">±0¢</span><span class="hz">523.3</span></div>
    <div class="key" data-freq="588.69"><span class="h">9</span><span class="kbd">s</span><span class="note">D<sub>5</sub></span><span class="cents">+4¢</span><span class="hz">588.7</span></div>
    <div class="key" data-freq="654.10"><span class="h">10</span><span class="kbd">d</span><span class="note">E<sub>5</sub></span><span class="cents">-14¢</span><span class="hz">654.1</span></div>
    <div class="key offish" data-freq="719.51"><span class="h">11</span><span class="kbd">f</span><span class="note">F♯<sub>5</sub></span><span class="cents">-49¢</span><span class="hz">719.5</span></div>
    <div class="key" data-freq="784.92"><span class="h">12</span><span class="kbd">g</span><span class="note">G<sub>5</sub></span><span class="cents">+2¢</span><span class="hz">784.9</span></div>
    <div class="key offish" data-freq="850.33"><span class="h">13</span><span class="kbd">h</span><span class="note">G♯<sub>5</sub></span><span class="cents">+41¢</span><span class="hz">850.3</span></div>
    <div class="key offish" data-freq="915.74"><span class="h">14</span><span class="kbd">j</span><span class="note">A♯<sub>5</sub></span><span class="cents">-31¢</span><span class="hz">915.7</span></div>
    <div class="key" data-freq="981.15"><span class="h">15</span><span class="kbd">k</span><span class="note">B<sub>5</sub></span><span class="cents">-12¢</span><span class="hz">981.1</span></div>
    <div class="key" data-freq="1046.56"><span class="h">16</span><span class="kbd">l</span><span class="note">C<sub>6</sub></span><span class="cents">±0¢</span><span class="hz">1046.6</span></div>
  </div>
</div>

<script>
(() => {
  const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const KB_KEYS = 'asdfghjklqwertyuiop'; // typing layout, indexed by key position
  // full mode: physical rows top-to-bottom; harmonics climb from the
  // bottom row up, so Z is the fundamental and ] is harmonic 33
  const MATRIX_ROWS = ['qwertyuiop[]', "asdfghjkl;'", 'zxcvbnm,./'];
  const kbMap = new Map(); // typed character -> key element
  const keysEl = document.getElementById('keys');
  const fundEl = document.getElementById('fund');

  let fundamental = parseFloat(fundEl.value);
  let mode = '8'; // '8' | '16' | 'full'
  let toneType = 'horn';

  let ctx = null;
  let master = null;
  let hornWave = null;
  let analyser = null;
  const voices = new Map(); // pointerId -> {osc, gain, el}

  function audio() {
    if (!ctx || ctx.state === 'closed') {
      // larger buffers: avoids crackle/underruns on USB & Bluetooth outputs
      ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
      master = ctx.createGain();
      // headroom: keep a worst-case pileup of overlapping release
      // tails (one per key) below full scale to avoid clipping
      master.gain.value = 0.25;
      // tanh soft clipper: full-keyboard pileups saturate gently
      // instead of hard-clipping the DAC
      const shaper = ctx.createWaveShaper();
      const curve = new Float32Array(1024);
      for (let i = 0; i < curve.length; i++) {
        const x = (i / (curve.length - 1)) * 2 - 1;
        curve[i] = Math.tanh(1.5 * x) / Math.tanh(1.5);
      }
      shaper.curve = curve;
      shaper.oversample = '2x';
      master.connect(shaper).connect(ctx.destination);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 4096; // bins fine enough to give each harmonic its own spoke
      analyser.smoothingTimeConstant = 0.85;
      shaper.connect(analyser);
      // brassy-ish spectrum for the horn tone
      const n = 8;
      const real = new Float32Array(n + 1);
      const imag = new Float32Array(n + 1);
      for (let i = 1; i <= n; i++) imag[i] = 1 / (i * 1.3);
      hornWave = ctx.createPeriodicWave(real, imag);
    }
    // iOS reports 'interrupted' (non-standard) after audio-route changes
    // like unplugging USB/CarPlay; resume from any non-running state
    if (ctx.state !== 'running') {
      ctx.resume();
      // if it stays wedged, scrap it so the next tap builds a fresh context
      setTimeout(() => {
        if (ctx && ctx.state !== 'running') {
          try { ctx.close(); } catch (e) {}
          ctx = null;
          setHint('🔇 Audio was stopped by the system — tap a key again.');
        }
      }, 300);
    }
    return ctx;
  }

  function setHint(text) {
    document.getElementById('hint').textContent = text;
  }

  document.addEventListener('visibilitychange', () => {
    if (ctx && document.visibilityState === 'visible' && ctx.state !== 'running') ctx.resume();
  });

  function describe(freq) {
    const midi = 69 + 12 * Math.log2(freq / 440);
    const nearest = Math.round(midi);
    const cents = Math.round((midi - nearest) * 100);
    const name = NOTE_NAMES[((nearest % 12) + 12) % 12];
    const octave = Math.floor(nearest / 12) - 1;
    return { name, octave, cents };
  }

  function makeKey(h, kbChar) {
    const freq = fundamental * h;
    const { name, octave, cents } = describe(freq);
    const key = document.createElement('div');
    key.className = 'key' + (Math.abs(cents) >= 15 ? ' offish' : '');
    key.dataset.freq = freq;
    key.innerHTML =
      `<span class="h">${h}</span>` +
      `<span class="kbd">${kbChar || ''}</span>` +
      `<span class="note">${name}<sub>${octave}</sub></span>` +
      `<span class="cents">${cents === 0 ? '±0' : (cents > 0 ? '+' : '') + cents}¢</span>` +
      `<span class="hz">${freq.toFixed(1)}</span>`;
    if (kbChar) kbMap.set(kbChar, key);
    return key;
  }

  function buildKeys() {
    keysEl.innerHTML = '';
    kbMap.clear();
    keysEl.classList.toggle('dense', mode === '16');
    keysEl.classList.toggle('matrix', mode === 'full');
    if (mode === 'full') {
      // assign harmonics bottom row first (z = h1), but append rows
      // top-to-bottom so the screen matches the physical keyboard
      const rowEls = MATRIX_ROWS.map(() => {
        const row = document.createElement('div');
        row.className = 'krow';
        return row;
      });
      let h = 1;
      for (let r = MATRIX_ROWS.length - 1; r >= 0; r--) {
        for (const ch of MATRIX_ROWS[r]) rowEls[r].appendChild(makeKey(h++, ch));
      }
      rowEls.forEach(row => keysEl.appendChild(row));
    } else {
      const lo = mode === '16' ? 16 : 8;
      for (let h = lo; h <= lo * 2; h++) {
        keysEl.appendChild(makeKey(h, KB_KEYS[h - lo]));
      }
    }
  }

  function startVoice(pointerId, keyEl) {
    if (voices.has(pointerId)) stopVoice(pointerId);
    const ac = audio();
    const freq = parseFloat(keyEl.dataset.freq);
    const osc = ac.createOscillator();
    if (toneType === 'horn' && hornWave) osc.setPeriodicWave(hornWave);
    else osc.type = 'sine';
    osc.frequency.value = freq;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + 0.02);
    osc.connect(gain).connect(master);
    osc.start();
    voices.set(pointerId, { osc, gain, el: keyEl });
    keyEl.classList.add('active');
    if (ac.state === 'running') setHint(READY);
  }

  function stopVoice(pointerId) {
    const v = voices.get(pointerId);
    if (!v) return;
    voices.delete(pointerId);
    v.el.classList.remove('active');
    if (!ctx || ctx.state === 'closed') return;
    const t = ctx.currentTime;
    v.gain.gain.cancelScheduledValues(t);
    v.gain.gain.setValueAtTime(Math.max(v.gain.gain.value, 0.0001), t);
    // asymptotic release lands at true zero — no click at oscillator stop
    v.gain.gain.setTargetAtTime(0, t, 0.35);
    v.osc.stop(t + 2.5);
  }

  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const key = el && el.closest('.key');
    if (key) return key;
    // fast taps often land in the gaps between keys; snap to the
    // nearest key instead of dropping the touch
    const area = keysEl.getBoundingClientRect();
    if (x < area.left || x > area.right || y < area.top || y > area.bottom) return null;
    let best = null, bestDist = Infinity;
    for (const k of keysEl.getElementsByClassName('key')) {
      const b = k.getBoundingClientRect();
      const dx = Math.max(b.left - x, 0, x - b.right);
      const dy = Math.max(b.top - y, 0, y - b.bottom);
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = k; }
    }
    return best;
  }

  keysEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    const key = keyAt(e.clientX, e.clientY);
    if (key) startVoice(e.pointerId, key);
  });

  keysEl.addEventListener('pointermove', e => {
    const v = voices.get(e.pointerId);
    if (!v) return;
    const key = keyAt(e.clientX, e.clientY);
    if (key && key !== v.el) {
      stopVoice(e.pointerId);
      startVoice(e.pointerId, key);
    }
  });

  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
    document.addEventListener(ev, e => stopVoice(e.pointerId)));

  // fallbacks for webviews without pointer events
  if (!window.PointerEvent) {
    keysEl.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const key = keyAt(t.clientX, t.clientY);
        if (key) startVoice(t.identifier, key);
      }
    }, { passive: false });
    keysEl.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const v = voices.get(t.identifier);
        if (!v) continue;
        const key = keyAt(t.clientX, t.clientY);
        if (key && key !== v.el) {
          stopVoice(t.identifier);
          startVoice(t.identifier, key);
        }
      }
    }, { passive: false });
    ['touchend', 'touchcancel'].forEach(ev =>
      document.addEventListener(ev, e => {
        for (const t of e.changedTouches) stopVoice(t.identifier);
      }));
    keysEl.addEventListener('mousedown', e => {
      const key = keyAt(e.clientX, e.clientY);
      if (key) startVoice('mouse', key);
    });
    document.addEventListener('mouseup', () => stopVoice('mouse'));
  }

  // --- play with a computer keyboard, Ableton-style: home row for
  // the first nine harmonics, QWERTY row continues in 16-32 mode ---
  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && e.target.tagName === 'SELECT') return;
    const ch = e.key.toLowerCase();
    const keyEl = kbMap.get(ch);
    if (!keyEl) return;
    e.preventDefault();
    document.body.classList.add('kbd-on');
    startVoice('kb:' + ch, keyEl);
  });
  document.addEventListener('keyup', e => {
    const ch = e.key.toLowerCase();
    if (kbMap.has(ch)) stopVoice('kb:' + ch);
  });
  // keyup events are lost when the window loses focus mid-press
  window.addEventListener('blur', () => {
    for (const id of [...voices.keys()]) stopVoice(id);
  });

  // --- oscilloscope: master-bus waveform wrapped into a ring, so a
  // tone with n cycles per buffer draws an n-lobed wobbling shape ---
  const SCOPE_SAMPLES = 1024;
  const scopeBuf = new Uint8Array(SCOPE_SAMPLES);
  const freqBuf = new Uint8Array(2048); // analyser.frequencyBinCount at fftSize 4096
  const scopeCanvas = document.querySelector('#scope canvas');
  const g = scopeCanvas.getContext('2d');
  let rot = 0;

  function sizeScope() {
    const dpr = window.devicePixelRatio || 1;
    const r = scopeCanvas.getBoundingClientRect();
    scopeCanvas.width = Math.max(1, Math.round(r.width * dpr));
    scopeCanvas.height = Math.max(1, Math.round(r.height * dpr));
    g.fillStyle = '#14161c';
    g.fillRect(0, 0, scopeCanvas.width, scopeCanvas.height);
  }
  window.addEventListener('resize', sizeScope);
  window.addEventListener('orientationchange', sizeScope);

  function drawScope() {
    requestAnimationFrame(drawScope);
    const w = scopeCanvas.width, h = scopeCanvas.height;
    if (!w || !h) return;
    // translucent wipe leaves a phosphor-style trail
    g.fillStyle = 'rgba(20, 22, 28, 0.12)';
    g.fillRect(0, 0, w, h);
    if (analyser) {
      analyser.getByteTimeDomainData(scopeBuf);
      analyser.getByteFrequencyData(freqBuf);
    } else {
      scopeBuf.fill(128);
      freqBuf.fill(0);
    }
    // loudness drives wobble depth, spin speed and color heat
    let sum = 0;
    for (let i = 0; i < SCOPE_SAMPLES; i++) {
      const s = (scopeBuf[i] - 128) / 128;
      sum += s * s;
    }
    const amp = Math.min(1, Math.sqrt(sum / SCOPE_SAMPLES) * 6);
    const cx = w / 2, cy = h / 2;
    const R = Math.min(w, h) * (0.30 + 0.05 * amp);
    rot += 0.0025 + 0.02 * amp;
    const dpr = window.devicePixelRatio || 1;

    // radial spectrum fan: spoke angle is proportional to frequency,
    // so the harmonics of one fundamental appear at equal angular
    // steps — interval ratios become visible as angle ratios
    let hue = 35;
    if (ctx && analyser) {
      const binHz = ctx.sampleRate / analyser.fftSize;
      const maxBin = Math.min(freqBuf.length - 1, Math.round(fundamental * 34 / binHz));
      let wsum = 0, msum = 0;
      g.beginPath();
      for (let i = 1; i <= maxBin; i++) {
        const v = freqBuf[i] / 255;
        if (v < 0.05) continue;
        wsum += i * v;
        msum += v;
        const a = rot + (i / maxBin) * 2 * Math.PI;
        const r0 = R * 0.2;
        const r1 = r0 + Math.pow(v, 1.5) * R * 0.85;
        g.moveTo(cx + r0 * Math.cos(a), cy + r0 * Math.sin(a));
        g.lineTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a));
      }
      // spectral centroid tilts the color: low notes amber, high cyan
      if (msum > 0) hue = 35 + 140 * Math.min(1, wsum / msum / maxBin * 2);
      g.strokeStyle = `hsla(${hue}, 85%, 65%, ${0.25 + 0.45 * amp})`;
      g.lineWidth = 1.5 * dpr;
      g.stroke();
    }

    // waveform ring
    g.beginPath();
    for (let i = 0; i <= SCOPE_SAMPLES; i++) {
      const v = (scopeBuf[i % SCOPE_SAMPLES] - 128) / 128;
      const a = rot + (i / SCOPE_SAMPLES) * 2 * Math.PI;
      const r = R * (1 + (0.45 + 0.4 * amp) * v);
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.lineJoin = 'round';
    g.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.18 + 0.3 * amp})`;
    g.lineWidth = (4 + 6 * amp) * dpr;
    g.stroke();
    g.strokeStyle = `hsl(${hue}, 85%, ${70 + 15 * amp}%)`;
    g.lineWidth = 1.6 * dpr;
    g.stroke();
  }
  sizeScope();
  requestAnimationFrame(drawScope);

  fundEl.addEventListener('change', () => {
    fundamental = parseFloat(fundEl.value);
    buildKeys();
  });

  document.getElementById('range').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    mode = btn.dataset.mode;
    btn.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    buildKeys();
  });

  document.getElementById('tone').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    toneType = btn.dataset.tone;
    btn.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
  });

  const READY = '✓ Ready — tap or drag the keys to play. Amber notes stray from 12-TET.';
  buildKeys();
  // visible proof that scripts are running; static text means JS is blocked
  setHint(READY);
})();
</script>
</body>
</html>
